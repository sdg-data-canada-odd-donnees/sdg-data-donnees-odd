SDG_GOAL: '<p>Goal 17: Strengthen the means of implementation and revitalize the global
  partnership for sustainable development</p>'
SDG_TARGET: '<p>Target 17.14: Enhance policy coherence for sustainable development</p>'
SDG_INDICATOR: <p>Indicator 17.14.1. Number of countries with mechanisms in place to enhance policy coherence of sustainable development</p>
STAT_CONC_DEF: <p>The United Nations Environment Programme (UNEP) and the Organisation for Economic Co-operation and 
  Development (OECD) have developed a composite indicator framework for SDG indicator 17.14.1 that is 
  based on initial research on existing work, literature, partners and existing indicators on similar issues. This 
  indicator considers institutional and organisational mechanisms that can support efforts in enhancing 
  Policy Coherence of Sustainable Development (PCSD) across eight themes:</p>
  <ol>
  <li>Political Commitment</li>
  <li>Long-term Vision</li>
  <li>The Integration of Sustainable Development into Policy and Finance</li>
  <li>Whole-of-government Coordination</li>
  <li>Sub-national Engagement</li>
  <li>Stakeholder-engagement</li>
  <li>Impact Assessment</li>
  <li>Monitoring, Evaluation, and Reporting</li>
  </ol>
DATA_COMP: "Each of the eight themes is scored on a scale from 0 to 12, where 0 means none of the requested 
  mechanisms are implemented, 12 means all the requested mechanisms are in place and fully implemented. 
  Scaling all 8 themes, the maximum value is 96. The score out of 96 (or out of 12 for the themes) is converted to a percentage for the purpose of reporting SDG indicator 17.14.1."
