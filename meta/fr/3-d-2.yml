  Pourcentage des septicémies causées par le <em>Staphylococcus aureus</em> résistant à la méthicilline (SARM) et par l’<em>Escherichia coli</em> résistant aux céphalosporines de 3e génération (p. ex. BLSE-E. coli) parmi les patients qui ont besoin de soins et dont un échantillon de sang est prélevé et testé.
