SDG_GOAL: '<p>Objectif 17 : Renforcer les moyens de mettre en œuvre le Partenariat
  mondial pour le développement durable et le revitaliser</p>'
SDG_TARGET: 'Cible 17.14 : Renforcer la cohérence des politiques de développement 
  durable'
SDG_INDICATOR: '<p>Indicateur 17.14.1 : Nombre de pays ayant mis en place des mécanismes 
  pour renforcer la cohérence des politiques de développement durable</p>'
STAT_CONC_DEF: |
 <p>Le Programme des Nations Unies pour l'environnement (PNUE) et l'Organisation de coopération et de 
  développement économiques (OCDE) ont élaboré un cadre d'indicateurs composites pour l'indicateur 17.14.1 des ODD, qui 
  s'appuie sur des recherches préliminaires portant sur les travaux existants, la littérature, les partenaires et les indicateurs existants relatifs à des questions similaires. Cet 
  indicateur prend en compte les mécanismes institutionnels et organisationnels susceptibles de soutenir les efforts visant à renforcer la 
  cohérence des politiques en faveur du développement durable (PCSD) à travers huit thèmes :</p>
  <ol>
  <li>Engagement politique</li>
  <li>Vision à long terme</li>
  <li>Intégration du développement durable dans les politiques et les finances</li>
  <li>Coordination à l'échelle de l'ensemble du gouvernement</li>
  <li>Engagement au niveau infranational</li>
  <li>Engagement des parties prenantes</li>
  <li>Évaluation d'impact</li>
  <li>Suivi, évaluation et rapports</li>
  </ol>
DATA_COMP: "Chacun des huit thèmes est noté sur une échelle de 0 à 12, où 0 signifie qu'aucun des mécanismes requis 
  n'est mis en œuvre, et 12 signifie que tous les mécanismes requis sont en place et pleinement mis en œuvre. 
  En additionnant les notes des 8 thèmes, la valeur maximale est de 96. La note sur 96 (ou sur 12 pour les thèmes) est convertie en pourcentage aux fins de la communication de l'indicateur 17.14.1 des ODD."
