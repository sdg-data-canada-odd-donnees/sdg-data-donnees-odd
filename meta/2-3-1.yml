# NATIONAL
SDG_GOAL: '<p>Goal 2: End hunger, achieve food security and improved nutrition and
  promote sustainable agriculture</p>'
SDG_TARGET: '<p>Target 2.3: By 2030, double the agricultural productivity and incomes
  of small-scale food producers, in particular women, indigenous peoples, family farmers,
  pastoralists and fishers, including through secure and equal access to land, other
  productive resources and inputs, knowledge, financial services, markets and opportunities
  for value addition and non-farm employment</p>'
SDG_INDICATOR: '<p>Indicator 2.3.1: Volume of production per labour unit by classes of farming/pastoral/forestry enterprise size</p>'
STAT_CONC_DEF: |
  Volume of agricultural production of small-scale food producer in crop, livestock, fisheries, and forestry 
  activities per number of days worked. The indicator is computed as a ratio of annual output to the 
  number of working days in one year.
DATA_COMP: '   '
REC_USE_LIM: |
  Total revenue is not calculated using a constant selling price for product i in year t; rather, it reflects the nominal prices received for each product at each sale. Sales may be recorded on a cash or accrual basis, depending on each producer’s accounting preferences.
  <br><br>
  The average annual productivity is calculated as the ratio of total revenue to the number of farm operators, rather than by the number of labor days employed, as specified in the UN metadata'
 
PROGRESS_DETAILS: custom.progress-details
